[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steve-router"
version = "0.1.0"
description = "Phase 1 JEV text-to-typed-command router for voice-to-Go2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk==0.7.0"]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<0.6", "websocket-client>=1.8,<2"]

[project.scripts]
steve-route = "steve_router.cli:main"
steve-voice = "steve_voice.cli:main"

[tool.setuptools.packages.find]
include = ["steve_router*", "steve_voice*"]
